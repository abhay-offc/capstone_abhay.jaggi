---
- hosts: webservers
  become: yes

  tasks:

    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create Homepage
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Web Server Installed Using Ansible by abhay</h1>
